<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOCR定例MTG ナレッジサイト</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e9ecef;padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-title{font-size:18px;font-weight:600;color:#1a1a1a}
.gdrive-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#e8f5e9;color:#2e7d32;font-weight:500}
.container{max-width:860px;margin:0 auto;padding:24px 16px}
.nav{display:flex;gap:4px;margin-bottom:24px;background:#fff;border:1px solid #e9ecef;border-radius:10px;padding:6px;flex-wrap:wrap}
.nav-btn{padding:8px 16px;border-radius:7px;border:none;font-size:13px;cursor:pointer;background:transparent;color:#666;transition:all .15s;font-weight:500;display:flex;align-items:center;gap:6px}
.nav-btn.active{background:#f0f4ff;color:#3451b2;font-weight:600}
.nav-btn:hover:not(.active){background:#f5f5f5}
.nav-btn.post-btn{margin-left:auto;background:#3451b2;color:#fff}
.nav-btn.post-btn:hover{background:#2d45a0}
.page{display:none}.page.active{display:block}
.section-title{font-size:20px;font-weight:600;margin-bottom:16px;color:#1a1a1a}
.card{background:#fff;border:1px solid #e9ecef;border-radius:10px;padding:16px 20px;margin-bottom:12px}
.update-card{border-left:4px solid #1D9E75;border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:10px;background:#fff;border-top:1px solid #e9ecef;border-right:1px solid #e9ecef;border-bottom:1px solid #e9ecef}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.badge-new{background:#e8f5e9;color:#2e7d32}
.badge-fix{background:#fce4ec;color:#c62828}
.badge-up{background:#e3f2fd;color:#1565c0}
.badge-info{background:#fff8e1;color:#e65100}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#f0f0f0;color:#555;margin-right:4px;margin-bottom:2px}
.meta{font-size:12px;color:#999;margin-bottom:6px}
.btn{padding:7px 14px;border-radius:7px;border:1px solid #ddd;background:#fff;color:#333;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#3451b2;color:#fff;border-color:transparent}
.btn-primary:hover{background:#2d45a0}
.btn-danger{color:#c62828;border-color:#f8bbd0}
.btn-danger:hover{background:#fce4ec}
textarea,input[type=text]{width:100%;padding:10px 12px;border-radius:7px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-family:inherit;font-size:13px;resize:vertical;transition:border .15s}
textarea:focus,input:focus{outline:none;border-color:#3451b2;box-shadow:0 0 0 3px rgba(52,81,178,0.1)}
.status-bar{font-size:12px;padding:8px 14px;border-radius:7px;margin-top:10px;display:none}
.status-ok{background:#e8f5e9;color:#2e7d32;display:block}
.status-err{background:#fce4ec;color:#c62828;display:block}
.status-loading{background:#f5f5f5;color:#666;display:block}
.empty{text-align:center;padding:48px 24px;color:#999;font-size:14px}
.empty i{font-size:32px;display:block;margin-bottom:12px;opacity:0.4}
.post-area{background:#fff;border:1px solid #e9ecef;border-radius:10px;padding:20px 24px;margin-bottom:24px}
.post-title{font-size:15px;font-weight:600;margin-bottom:14px;color:#1a1a1a;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.date-in{width:170px;flex-shrink:0}
.title-in{flex:1}
.faq-q{font-weight:600;font-size:14px;margin-bottom:6px;color:#1a1a1a}
.faq-a{font-size:13px;color:#555;line-height:1.75}
.edit-area{margin-top:12px;display:none;border-top:1px solid #f0f0f0;padding-top:12px}
.expand-btn{font-size:12px;color:#3451b2;cursor:pointer;background:none;border:none;padding:0;margin-top:6px}
.minutes-body{font-size:13px;line-height:1.8;white-space:pre-wrap;color:#555}
.gdrive-note{font-size:11px;color:#999;margin-top:8px;display:flex;align-items:center;gap:4px}
.loading-spinner{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.row-actions{display:flex;justify-content:space-between;align-items:flex-start}
</style>
</head>
<body>

<div class="header">
  <i class="ti ti-file-text" style="font-size:22px;color:#3451b2"></i>
  <span class="header-title">AIOCR定例MTG ナレッジサイト</span>
  <span class="gdrive-badge"><i class="ti ti-brand-google-drive"></i> Google Drive連携</span>
</div>

<div class="container">
  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('updates',this)"><i class="ti ti-sparkles"></i> 最新アップデート</button>
    <button class="nav-btn" onclick="showPage('minutes',this)"><i class="ti ti-notebook"></i> 議事録</button>
    <button class="nav-btn" onclick="showPage('faq',this)"><i class="ti ti-help-circle"></i> FAQ詳細</button>
    <button class="nav-btn post-btn" onclick="showPage('post',this)"><i class="ti ti-plus"></i> 議事録を投稿</button>
  </nav>

  <div id="page-updates" class="page active">
    <div class="section-title">最新アップデート情報</div>
    <div id="updates-list"><div class="empty"><i class="ti ti-loader loading-spinner"></i>読み込み中...</div></div>
  </div>

  <div id="page-minutes" class="page">
    <div class="section-title">議事録アーカイブ</div>
    <div id="minutes-list"><div class="empty"><i class="ti ti-loader loading-spinner"></i>読み込み中...</div></div>
  </div>

  <div id="page-faq" class="page">
    <div class="section-title">FAQ詳細</div>
    <div id="faq-list"><div class="empty"><i class="ti ti-loader loading-spinner"></i>読み込み中...</div></div>
  </div>

  <div id="page-post" class="page">
    <div class="post-area">
      <div class="post-title"><i class="ti ti-upload"></i> 議事録を投稿してAIに解析させる</div>
      <div class="row">
        <input type="text" class="date-in" id="in-date" placeholder="開催日 例：2025-06-09">
        <input type="text" class="title-in" id="in-title" placeholder="タイトル 例：第12回 AIOCR定例MTG">
      </div>
      <textarea id="in-body" style="min-height:160px" placeholder="議事録のテキストをここに貼り付けてください..."></textarea>
      <div style="margin-top:12px">
        <button class="btn btn-primary" onclick="submitMinutes()"><i class="ti ti-wand"></i> AI解析してGoogle Driveに保存</button>
      </div>
      <div id="post-status" class="status-bar"></div>
      <div class="gdrive-note"><i class="ti ti-brand-google-drive"></i> 保存先：Google Drive / AIOCR定例MTG ナレッジベース</div>
    </div>
  </div>
</div>

<script>
const ANTHROPIC_API_KEY = 'ここにAPIキーを入力';
const FILE_IDS = {
  minutes: '1RMowOq2Vqd0y3g43RSO35tPKUlVgqjHq',
  updates: '1mOIWgz8JnjzsGW_XC2W7VapVoOhUxrdB',
  faqs:    '18Tad5FY2l9rGhkSWLlZmrZDBUQz4qpUC'
};

function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(btn) btn.classList.add('active');
  if(p==='updates') renderUpdates();
  if(p==='minutes') renderMinutes();
  if(p==='faq') renderFaqs();
}

function badgeClass(t) {
  if(t==='新機能') return 'badge-new';
  if(t==='改善') return 'badge-up';
  if(t==='修正') return 'badge-fix';
  return 'badge-info';
}

async function callClaude(prompt, maxTokens=4000) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json','x-api-key': ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      mcp_servers: [{type:'url', url:'https://drivemcp.googleapis.com/mcp/v1', name:'gdrive'}],
      messages: [{role:'user', content: prompt}]
    })
  });
  const data = await res.json();
  return data.content.filter(c=>c.type==='text').map(c=>c.text).join('');
}

async function readDriveFile(key) {
  try {
    const text = await callClaude(`Google DriveのファイルID「${FILE_IDS[key]}」の内容をJSON配列のみで返してください。説明不要。`);
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } catch(e) { return []; }
}

async function writeDriveFile(key, arr) {
  await callClaude(`Google DriveのファイルID「${FILE_IDS[key]}」を以下のJSONで完全に上書きしてください。\n${JSON.stringify(arr,null,2)}`, 500);
}

async function renderUpdates() {
  const el = document.getElementById('updates-list');
  el.innerHTML='<div class="empty"><i class="ti ti-loader loading-spinner"></i> Google Driveから読み込み中...</div>';
  const data = await readDriveFile('updates');
  if(!data.length){el.innerHTML='<div class="empty"><i class="ti ti-database-off"></i>まだ登録されていません。<br>議事録を投稿するとAIが自動で抽出します。</div>';return;}
  el.innerHTML=data.map((u,i)=>`
    <div class="update-card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="badge ${badgeClass(u.type)}">${u.type}</span>
        <span style="font-size:12px;color:#999">${u.date}</span>
        <span class="tag">${u.source}</span>
      </div>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${u.title}</div>
      <div style="font-size:13px;color:#555;line-height:1.7">${u.body}</div>
    </div>`).join('');
}

async function renderMinutes() {
  const el = document.getElementById('minutes-list');
  el.innerHTML='<div class="empty"><i class="ti ti-loader loading-spinner"></i> Google Driveから読み込み中...</div>';
  const data = await readDriveFile('minutes');
  if(!data.length){el.innerHTML='<div class="empty"><i class="ti ti-notebook-off"></i>まだ議事録がありません。</div>';return;}
  el.innerHTML=data.map((m,i)=>`
    <div class="card">
      <div class="row-actions">
        <div>
          <div class="meta">${m.date}</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:10px">${m.title}</div>
        </div>
        <button class="btn btn-danger" style="font-size:12px;padding:4px 10px" onclick="deleteMinute(${i})"><i class="ti ti-trash"></i></button>
      </div>
      <div class="minutes-body" id="mb-${i}">${m.body.substring(0,200)}${m.body.length>200?'…':''}</div>
      ${m.body.length>200?`<button class="expand-btn" onclick="toggleMin(${i},'${encodeURIComponent(m.body)}')">全文を見る ▼</button>`:''}
    </div>`).join('');
}

function toggleMin(i, enc) {
  const el=document.getElementById('mb-'+i), btn=el.nextElementSibling;
  if(!btn) return;
  if(btn.textContent.includes('▼')){el.textContent=decodeURIComponent(enc);btn.textContent='閉じる ▲';}
  else{el.textContent=decodeURIComponent(enc).substring(0,200)+'…';btn.textContent='全文を見る ▼';}
}

async function deleteMinute(i) {
  if(!confirm('この議事録を削除しますか？')) return;
  const data = await readDriveFile('minutes');
  data.splice(i,1);
  await writeDriveFile('minutes', data);
  renderMinutes();
}

async function renderFaqs() {
  const el = document.getElementById('faq-list');
  el.innerHTML='<div class="empty"><i class="ti ti-loader loading-spinner"></i> Google Driveから読み込み中...</div>';
  const data = await readDriveFile('faqs');
  if(!data.length){el.innerHTML='<div class="empty"><i class="ti ti-help-off"></i>まだFAQがありません。</div>';return;}
  el.innerHTML=data.map((f,i)=>`
    <div class="card" id="fcard-${i}">
      <div class="row-actions">
        <div style="flex:1;margin-right:8px">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
            ${(f.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
            <span style="font-size:11px;color:#bbb">${f.source||''}</span>
          </div>
          <div class="faq-q" id="fq-${i}">${f.q}</div>
          <div class="faq-a" id="fa-${i}">${f.a}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn" style="font-size:12px;padding:4px 10px" onclick="toggleEdit(${i})"><i class="ti ti-edit"></i></button>
          <button class="btn btn-danger" style="font-size:12px;padding:4px 10px" onclick="deleteFaq(${i})"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="edit-area" id="edit-${i}">
        <div style="font-size:12px;color:#888;margin-bottom:6px">Q（質問）</div>
        <textarea style="min-height:50px;margin-bottom:10px" id="eq-${i}">${f.q}</textarea>
        <div style="font-size:12px;color:#888;margin-bottom:6px">A（回答）</div>
        <textarea style="min-height:80px;margin-bottom:10px" id="ea-${i}">${f.a}</textarea>
        <div style="font-size:12px;color:#888;margin-bottom:6px">タグ（カンマ区切り）</div>
        <input type="text" id="et-${i}" value="${(f.tags||[]).join(',')}" style="margin-bottom:12px">
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="font-size:12px" onclick="saveFaq(${i})"><i class="ti ti-check"></i> 保存</button>
          <button class="btn" style="font-size:12px" onclick="toggleEdit(${i})">キャンセル</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleEdit(i) {
  const ea=document.getElementById('edit-'+i);
  ea.style.display=ea.style.display==='block'?'none':'block';
}

async function saveFaq(i) {
  const data = await readDriveFile('faqs');
  data[i].q=document.getElementById('eq-'+i).value.trim();
  data[i].a=document.getElementById('ea-'+i).value.trim();
  data[i].tags=document.getElementById('et-'+i).value.split(',').map(t=>t.trim()).filter(Boolean);
  await writeDriveFile('faqs', data);
  document.getElementById('fq-'+i).textContent=data[i].q;
  document.getElementById('fa-'+i).textContent=data[i].a;
  toggleEdit(i);
}

async function deleteFaq(i) {
  if(!confirm('このFAQを削除しますか？')) return;
  const data = await readDriveFile('faqs');
  data.splice(i,1);
  await writeDriveFile('faqs', data);
  renderFaqs();
}

async function submitMinutes() {
  const date=document.getElementById('in-date').value.trim();
  const title=document.getElementById('in-title').value.trim();
  const body=document.getElementById('in-body').value.trim();
  const st=document.getElementById('post-status');
  if(!date||!title||!body){
    st.className='status-bar status-err';
    st.textContent='開催日・タイトル・本文を入力してください';return;
  }
  st.className='status-bar status-loading';
  st.textContent='AIが議事録を解析中...';

  try {
    const aiPrompt=`以下はAIOCRシステムの定例MTG議事録です。JSON形式のみで返答してください。説明文は不要です。\n\n【議事録】\n${body}\n\n【出力形式】\n{"updates":[{"type":"新機能 or 改善 or 修正 or お知らせ","title":"タイトル","body":"詳細説明"}],"faqs":[{"q":"質問文","a":"詳しい回答","tags":["タグ1","タグ2"]}]}\n\nupdatesはシステム変更・新機能・修正のみ。faqsはエラー対処・プロンプト設定・使い方などQ&A。各3〜6件目安。`;
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:aiPrompt}]})
    });
    const json = await res.json();
    const text = json.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);

    st.textContent='Google Driveに保存中...';
    const [mins,upds,faqs] = await Promise.all([
      readDriveFile('minutes'), readDriveFile('updates'), readDriveFile('faqs')
    ]);
    mins.unshift({date,title,body});
    (parsed.updates||[]).forEach(u=>upds.unshift({...u,date,source:title}));
    (parsed.faqs||[]).forEach(f=>faqs.unshift({...f,source:title}));
    await Promise.all([
      writeDriveFile('minutes',mins), writeDriveFile('updates',upds), writeDriveFile('faqs',faqs)
    ]);
    document.getElementById('in-date').value='';
    document.getElementById('in-title').value='';
    document.getElementById('in-body').value='';
    st.className='status-bar status-ok';
    st.textContent=`✓ 保存完了！アップデート${(parsed.updates||[]).length}件・FAQ${(parsed.faqs||[]).length}件をGoogle Driveに保存しました`;
  } catch(e) {
    st.className='status-bar status-err';
    st.textContent='エラーが発生しました。もう一度お試しください。';
  }
}

renderUpdates();
</script>
</body>
</html>
